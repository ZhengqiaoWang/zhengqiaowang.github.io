    <style>
        /* ================= 本页独有版式 ================= */
        .board {
            max-width: 640px;
        }

        /* 本页所有可点区域都撑到 44px */
        .masthead .mark {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
        }

        .masthead .icon-link,
        .masthead .theme-btn {
            width: 44px;
            height: 44px;
        }

        footer .foot__links a {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
        }

        /* ---- 01 快速模板 ---- */
        .tpl-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--sp-2);
        }

        .tpl-btn {
            justify-content: flex-start;
            padding: 0 var(--sp-4);
            min-height: 48px;
        }

        .tpl-idx {
            font-family: var(--mono);
            font-size: var(--fs-meta);
            letter-spacing: .06em;
            color: var(--ink-soft);
            flex-shrink: 0;
        }

        .tpl-btn.active {
            border-color: var(--accent);
            background: var(--accent-wash);
            color: var(--accent);
        }

        .tpl-btn.active .tpl-idx {
            color: var(--accent);
        }

        /* ---- 02 候选项 ---- */
        .add-row {
            display: flex;
            align-items: flex-end;
            gap: var(--sp-2);
        }

        .add-row .field {
            flex: 1;
            min-width: 0;
        }

        .add-row .btn {
            flex-shrink: 0;
            padding: 0 var(--sp-4);
        }

        .list-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: var(--sp-3);
            margin: var(--sp-5) 0 var(--sp-2);
        }

        .option-count {
            font-family: var(--mono);
            font-size: var(--fs-meta);
            letter-spacing: .04em;
            color: var(--ink-soft);
        }

        .options-list {
            list-style: none;
            border-top: 1px solid var(--line);
            counter-reset: opt;
        }

        .options-list li {
            display: flex;
            align-items: center;
            gap: var(--sp-3);
            padding: var(--sp-2) 0;
            border-bottom: 1px solid var(--line);
            animation: fadeIn .3s var(--ease);
        }

        .options-list li:not(.empty-tip)::before {
            counter-increment: opt;
            content: counter(opt, decimal-leading-zero);
            flex-shrink: 0;
            width: var(--sp-5);
            font-family: var(--mono);
            font-size: var(--fs-meta);
            letter-spacing: .08em;
            color: var(--accent);
        }

        .options-list li span {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: var(--fs-body);
            color: var(--ink);
        }

        .opt-del {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            padding: 0;
            background: none;
            border: 0;
            border-radius: var(--radius);
            color: var(--ink-soft);
            cursor: pointer;
            transition: color .18s var(--ease), background-color .18s var(--ease);
        }

        .opt-del:hover {
            color: var(--accent);
            background: var(--accent-wash);
        }

        .empty-tip {
            display: block;
            padding: var(--sp-5) 0;
            border-bottom: 1px solid var(--line);
            text-align: center;
            font-size: var(--fs-sm);
            color: var(--ink-soft);
        }

        /* ---- 03 抽一个 ---- */
        .draw-actions {
            display: flex;
            flex-wrap: wrap;
            gap: var(--sp-2);
        }

        .draw-actions .btn {
            flex: 1 1 180px;
        }

        .result {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--sp-1);
            min-height: 120px;
            margin-top: var(--sp-4);
            padding: var(--sp-5) var(--sp-4);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--paper-sunk);
            text-align: center;
            opacity: 0;
            transform: translateY(4px);
            transition: opacity .25s var(--ease), transform .25s var(--ease),
                border-color .25s var(--ease), background-color .25s var(--ease);
        }

        .result.show {
            opacity: 1;
            transform: none;
        }

        .result.rolling {
            border-color: var(--line-strong);
        }

        .result.rolling .result-value {
            animation: pulse .6s ease infinite alternate;
        }

        .result.winner {
            border-color: var(--accent);
            background: var(--accent-wash);
            animation: celebrate .5s var(--ease);
        }

        .result-label {
            font-family: var(--mono);
            font-size: var(--fs-meta);
            letter-spacing: .08em;
            color: var(--ink-soft);
        }

        .result.winner .result-label {
            color: var(--accent);
        }

        .result-value {
            font-size: var(--fs-h2);
            font-weight: 600;
            line-height: 1.3;
            color: var(--ink);
            word-break: break-word;
        }

        .again-btn {
            display: none;
            margin-top: var(--sp-2);
            padding: 0 var(--sp-5);
            border-color: transparent;
            color: var(--ink-soft);
        }

        .result.show:not(.rolling) .again-btn {
            display: inline-flex;
        }

        .again-btn:hover {
            border-color: transparent;
            color: var(--accent);
            background: var(--accent-wash);
        }

        .stats {
            margin-top: var(--sp-4);
        }

        .stats__head {
            margin-bottom: var(--sp-2);
        }

        .stats:has(.stats-list:empty) .stats__head {
            display: none;
        }

        .stats-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: var(--sp-2);
        }

        .stats-item {
            display: inline-flex;
            align-items: baseline;
            gap: var(--sp-2);
            padding: var(--sp-1) var(--sp-3);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            font-size: var(--fs-sm);
            color: var(--ink-soft);
        }

        .stat-label {
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .stat-count {
            font-family: var(--mono);
            font-size: var(--fs-meta);
            color: var(--ink);
            font-variant-numeric: tabular-nums;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes pulse {
            from {
                opacity: .5;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes celebrate {
            0% {
                transform: scale(.985);
            }

            55% {
                transform: scale(1.012);
            }

            100% {
                transform: scale(1);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .options-list li,
            .result,
            .result.winner,
            .result.rolling .result-value {
                animation: none !important;
                transition: none !important;
            }
        }

        @media (max-width: 620px) {
            .board {
                max-width: none;
            }

            .tpl-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .tpl-btn {
                padding: 0 var(--sp-3);
                gap: var(--sp-1);
            }

            .result {
                min-height: 104px;
            }
        }
    </style>
</head>

    <script>
        var options = [];
        var isRolling = false;

        // 选项持久化：只存字符串数组，隐私模式下读写失败直接忽略
        var STORAGE_KEY = 'zq.decision.options.v1';

        // 预设模板
        var templates = {
            'rock-paper-scissors': {
                label: '石头剪刀布',
                options: ['石头', '剪刀', '布']
            },
            'citywalk': {
                label: 'CityWalk 随机挑战',
                options: ['前进', '左转', '右转']
            },
            'yes-no': {
                label: '是/否',
                options: ['是', '否']
            },
            'dice': {
                label: '1-6',
                options: ['1', '2', '3', '4', '5', '6']
            }
        };

        var optionInput = document.getElementById('optionInput');
        var optionsList = document.getElementById('optionsList');
        var optionCount = document.getElementById('optionCount');
        var result = document.getElementById('result');
        var resultLabel = document.getElementById('resultLabel');
        var resultValue = document.getElementById('resultValue');
        var templateBtns = document.querySelectorAll('.template-btn');
        var statsList = document.getElementById('statsList');

        // 触发次数统计
        var stats = {};

        // 模板点击事件
        templateBtns.forEach(function (btn) {
            btn.addEventListener('click', function () {
                if (isRolling) return;
                var templateKey = this.getAttribute('data-template');
                applyTemplate(templateKey);
            });
        });

        function loadOptions() {
            try {
                var raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return [];
                var saved = JSON.parse(raw);
                if (!Array.isArray(saved)) return [];
                return saved.filter(function (item) {
                    return typeof item === 'string' && item.trim() !== '';
                });
            } catch (e) {
                return [];
            }
        }

        function saveOptions() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(options));
            } catch (e) {
                /* 隐私模式 / 存储已满，忽略即可 */
            }
            // 改动之后旧的分享链接就过期了，顺手把 #o= 去掉
            if ((window.location.hash || '').indexOf('#o=') === 0) {
                try {
                    history.replaceState(null, '', window.location.pathname + window.location.search);
                } catch (e) {
                }
            }
        }

        /* ---- 分享：把选项编码进 URL 的 #o=，不经过任何服务器 ---- */
        function encodeShare(list) {
            try {
                var bytes = new TextEncoder().encode(JSON.stringify(list));
                var bin = '';
                bytes.forEach(function (b) { bin += String.fromCharCode(b); });
                return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            } catch (e) {
                return '';
            }
        }

        function decodeShare(text) {
            try {
                var b64 = text.replace(/-/g, '+').replace(/_/g, '/');
                while (b64.length % 4) b64 += '=';
                var bin = atob(b64);
                var bytes = new Uint8Array(bin.length);
                for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                var list = JSON.parse(new TextDecoder().decode(bytes));
                if (!Array.isArray(list)) return null;
                list = list.filter(function (item) {
                    return typeof item === 'string' && item.trim() !== '';
                });
                return list.length ? list.slice(0, 40) : null;
            } catch (e) {
                return null;
            }
        }

        function readHashOptions() {
            var match = (window.location.hash || '').match(/^#o=(.+)$/);
            return match ? decodeShare(decodeURIComponent(match[1])) : null;
        }

        function copyText(text, done) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
            } else {
                fallbackCopy(text, done);
            }
        }

        function fallbackCopy(text, done) {
            var area = document.createElement('textarea');
            area.value = text;
            area.setAttribute('readonly', '');
            area.style.position = 'fixed';
            area.style.top = '0';
            area.style.opacity = '0';
            document.body.appendChild(area);
            area.select();
            try {
                document.execCommand('copy');
            } catch (e) {
                /* 复制失败也不打断流程，链接已经写进地址栏 */
            }
            document.body.removeChild(area);
            done();
        }

        function shareOptions() {
            var btn = document.getElementById('shareBtn');
            var original = '分享这组选项';

            if (options.length < 1) {
                if (btn) btn.textContent = '先加几个选项';
                setTimeout(function () { if (btn) btn.textContent = original; }, 1600);
                return;
            }

            var encoded = encodeShare(options);
            if (!encoded) return;

            try {
                history.replaceState(null, '', '#o=' + encoded);
            } catch (e) {
                /* 个别环境禁止改地址栏，链接本身仍然可用 */
            }

            copyText(window.location.origin + window.location.pathname + '#o=' + encoded, function () {
                if (!btn) return;
                btn.textContent = '链接已复制';
                setTimeout(function () { btn.textContent = original; }, 1600);
            });
        }

        function applyTemplate(key) {
            var template = templates[key];
            if (!template) return;

            options = template.options.slice();
            // 重置统计数据
            stats = {};
            options.forEach(function (opt) { stats[opt] = 0; });
            resetResult();
            renderOptions();
            renderStats();
            saveOptions();

            // 更新按钮状态
            templateBtns.forEach(function (btn) {
                btn.classList.toggle('active', btn.getAttribute('data-template') === key);
            });
        }

        function renderStats() {
            if (Object.keys(stats).length === 0) {
                statsList.innerHTML = '';
                return;
            }
            statsList.innerHTML = options.map(function (opt) {
                var count = stats[opt] || 0;
                return '<li class="stats-item"><span class="stat-label">' + escapeHtml(opt) + '</span><span class="stat-count">' + count + '</span></li>';
            }).join('');
        }

        // 回车键添加选项
        optionInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                addOption();
            }
        });

        function addOption() {
            if (isRolling) return;
            var value = optionInput.value.trim();
            if (!value) return;

            options.push(value);
            stats[value] = 0;
            optionInput.value = '';
            optionInput.focus();
            renderOptions();
            renderStats();
            saveOptions();
        }

        function removeOption(index) {
            if (isRolling) return;
            var removed = options.splice(index, 1)[0];
            delete stats[removed];
            renderOptions();
            renderStats();
            resetResult();
            saveOptions();
        }

        function clearAll() {
            if (isRolling) return;
            options = [];
            stats = {};
            renderOptions();
            renderStats();
            resetResult();
            saveOptions();

            // 清除模板选中状态
            templateBtns.forEach(function (btn) {
                btn.classList.remove('active');
            });
        }

        function resetResult() {
            result.classList.remove('show', 'rolling', 'winner');
            result.setAttribute('aria-busy', 'false');
            resultLabel.textContent = '';
            resultValue.textContent = '';
        }

        function renderOptions() {
            if (options.length === 0) {
                optionsList.innerHTML = '<li class="empty-tip" id="emptyTip">还没有添加任何选项</li>';
                optionCount.textContent = '';
                return;
            }

            optionCount.textContent = '共 ' + options.length + ' 个选项';
            optionsList.innerHTML = options.map(function (opt, index) {
                return '<li>' +
                    '<span>' + escapeHtml(opt) + '</span>' +
                    '<button class="opt-del" type="button" onclick="removeOption(' + index + ')" title="删除" aria-label="删除这个选项">' +
                    '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">' +
                    '<path d="M6 6l12 12M18 6L6 18"/></svg>' +
                    '</button>' +
                    '</li>';
            }).join('');
        }

        function randomSelect() {
            if (isRolling) return;
            if (options.length < 2) {
                resultLabel.textContent = '还差一点';
                resultValue.textContent = '请至少添加 2 个选项';
                result.setAttribute('aria-busy', 'false');
                result.classList.remove('rolling', 'winner');
                result.classList.add('show');
                return;
            }

            isRolling = true;
            // 禁用按钮
            document.querySelector('.random-btn').disabled = true;
            document.querySelector('.clear-btn').disabled = true;

            // 清除之前的状态；滚动期间对读屏软件静音，等结果出来再播报
            result.setAttribute('aria-busy', 'true');
            result.classList.remove('winner');
            result.classList.add('show', 'rolling');
            resultLabel.textContent = '正在选择…';

            var count = 0;
            var totalRolls = 20 + Math.floor(Math.random() * 15); // 20-35次滚动
            var baseSpeed = 60;
            var speed = baseSpeed;
            var rollInterval;

            function roll() {
                resultValue.textContent = options[Math.floor(Math.random() * options.length)];
                count++;

                if (count >= totalRolls) {
                    // 结束滚动，显示结果
                    clearInterval(rollInterval);
                    var finalIndex = Math.floor(Math.random() * options.length);
                    var chosen = options[finalIndex];
                    resultValue.textContent = chosen;

                    // 记录触发次数
                    if (stats[chosen] !== undefined) {
                        stats[chosen]++;
                    }
                    renderStats();

                    // 切换到结果状态
                    result.classList.remove('rolling');
                    result.classList.add('winner');
                    resultLabel.textContent = '结果是';
                    result.setAttribute('aria-busy', 'false');

                    // 恢复按钮
                    document.querySelector('.random-btn').disabled = false;
                    document.querySelector('.clear-btn').disabled = false;
                    isRolling = false;
                    return;
                }

                // 逐渐减速
                if (count > totalRolls * 0.6) {
                    speed += 20;
                }
                if (count > totalRolls * 0.8) {
                    speed += 30;
                }

                rollInterval = setTimeout(roll, speed);
            }

            roll();
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 页面载入时：优先用链接里带过来的选项，否则恢复上次的
        options = readHashOptions() || loadOptions();
        options.forEach(function (opt) {
            if (stats[opt] === undefined) stats[opt] = 0;
        });
        renderOptions();
        renderStats();

        var shareBtn = document.getElementById('shareBtn');
        if (shareBtn) {
            shareBtn.addEventListener('click', shareOptions);
        }
    </script>
