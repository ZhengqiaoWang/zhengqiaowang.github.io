    <main class="wrap page page--gallery" id="main">
        <h1 class="page-title">图库</h1>
        <p class="page-lede">
            自己拍的照片。按地点、年份、标签筛，筛完就是一片连续的网格。
            点开任意一张能看到拍摄地点、时间，以及机身与镜头参数；照片均已上架 Shutterstock。
        </p>
        <div class="page-meta">
            <span><b id="statPhotos">—</b> 张照片</span>
            <span><b id="statCities">—</b> 个地点</span>
            <span><b id="statYears">—</b> 个年份</span>
            <span><b id="statTags">—</b> 个标签</span>
        </div>

        <div class="filters">
            <div class="filters__row">
                <span class="filters__label">地点</span>
                <div class="rail" id="railCity" role="group" aria-label="按地点筛选"></div>
            </div>
            <div class="filters__row">
                <span class="filters__label">年份</span>
                <div class="rail" id="railYear" role="group" aria-label="按年份筛选"></div>
            </div>
            <div class="filters__row">
                <span class="filters__label">标签</span>
                <div class="rail" id="railTag" role="group" aria-label="按标签筛选"></div>
            </div>
            <div class="summary" id="summary" hidden>
                <span id="summaryText"></span>
                <button class="clear" id="clear" type="button">清除筛选</button>
            </div>
        </div>

        <div class="grid" id="grid">
            <p class="empty">正在读取照片…</p>
        </div>
        <div class="sentinel" id="sentinel" hidden>
            <span class="sentinel__bar" aria-hidden="true"><i></i></span>
            <span id="sentinelText"></span>
        </div>
    </main>

    <dialog class="lightbox" id="lb" aria-label="照片详情">
        <div class="lightbox__grid">
            <div class="lightbox__stage">
                <img id="lbImg" alt="">
                <button class="lightbox__nav" data-dir="prev" type="button" aria-label="上一张">‹</button>
                <button class="lightbox__nav" data-dir="next" type="button" aria-label="下一张">›</button>
            </div>
            <div class="lightbox__side">
                <button class="lightbox__close" id="lbClose" type="button" aria-label="关闭">✕</button>
                <div class="lightbox__idx" id="lbIdx"></div>
                <h2 class="lightbox__where" id="lbWhere"></h2>
                <p class="lightbox__when" id="lbWhen"></p>
                <dl class="exif" id="lbExif"></dl>
                <div class="lightbox__tags" id="lbTags"></div>
                <p class="lightbox__foot">
                    这张照片已上架
                    <a href="https://www.shutterstock.com/zh/g/ZhengqiaoWang" target="_blank"
                        rel="noopener noreferrer">Shutterstock</a>，喜欢可以去那里购买使用授权。
                </p>
            </div>
        </div>
    </dialog>
